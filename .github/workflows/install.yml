name: install

on:
  push:
    tags:
      - "v*"
    branches:
      - "**"
    paths:
      - ".github/workflows/install.yml"
      - ".github/workflows/android.yml"
      - ".github/workflows/mirrorchyan*.yml"
      - "android/**"
      - "requirements-android.txt"
      - "pyproject.toml"
      - "static/img/logo_transparent.png"
      - "LICENSE"
      - "CONTACT"
      - "assets/**"
      - "**.py"
  pull_request:
    branches:
      - "**"
    paths:
      - ".github/workflows/install.yml"
      - ".github/workflows/android.yml"
      - ".github/workflows/mirrorchyan*.yml"
      - "android/**"
      - "requirements-android.txt"
      - "pyproject.toml"
      - "static/img/logo_transparent.png"
      - "LICENSE"
      - "CONTACT"
      - "assets/**"
      - "**.py"
  workflow_dispatch:

permissions:
  contents: read

env:
  MAA_FRAMEWORK_VERSION: "v6.0.0-beta.3"
  MFAA_VERSION: "v2.16.6"

jobs:
  meta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: set_tag
        run: |
          # 只有推送 v* tag 才发版；分支推送、PR 和手动执行均只构建。
          is_release=${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
          if [[ "$is_release" == true ]]; then
            tag="$GITHUB_REF_NAME"
          else
            base_tag=$(git describe --tags --abbrev=0 --match "v*" || echo "v0.0.0")
            tag="${base_tag%%-*}-ci.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}.g${GITHUB_SHA:0:7}"
          fi

          is_prerelease=false
          if [[ "$tag" == *-* ]]; then
            is_prerelease=true
          fi

          # 预留开发包旧计数区间，此后始终由 install 工作流统一递增。
          echo "version_code=$((100000000 + GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))" >> "$GITHUB_OUTPUT"

          echo tag=$tag | tee -a $GITHUB_OUTPUT
          echo is_release=$is_release | tee -a $GITHUB_OUTPUT
          echo is_prerelease=$is_prerelease | tee -a $GITHUB_OUTPUT
    outputs:
      tag: ${{ steps.set_tag.outputs.tag }}
      is_release: ${{ steps.set_tag.outputs.is_release }}
      is_prerelease: ${{ steps.set_tag.outputs.is_prerelease }}
      version_code: ${{ steps.set_tag.outputs.version_code }}

  android:
    if: ${{ github.event_name != 'pull_request' }}
    needs: [meta]
    uses: ./.github/workflows/android.yml
    with:
      version: ${{ needs.meta.outputs.tag }}
      version-code: ${{ needs.meta.outputs.version_code }}
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

  prepare-wheels:
    runs-on: windows-latest
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - uses: actions/checkout@v7

      - name: Download wheels
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: |
          python scripts/download_wheels.py `
            --platform win_amd64 `
            --python-version 3.13 `
            --abi cp313 `
            --dest resource/wheels/win-x64

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-win-x64
          path: resource/wheels/win-x64


  install:
    needs: [meta, prepare-wheels]
    strategy:
      # 矩阵分平台构建
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x86_64
          - os: windows-latest
            platform: win
            arch: aarch64
      fail-fast: false
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # 下载 MaaFramework Release
      - name: Download MaaFramework
        uses: robinraju/release-downloader@v1
        with:
          repository: MaaXYZ/MaaFramework
          fileName: "MAA-${{ matrix.platform }}-${{ matrix.arch }}*"
          # 下载指定的 Release Tag
          tag: ${{ env.MAA_FRAMEWORK_VERSION}}
          out-file-path: "deps"
          extract: true

      # 下载 MFAAvalonia 源码
      - name: Checkout MFAAvalonia source
        uses: actions/checkout@v7
        with:
          repository: MaaXYZ/MFAAvalonia
          ref: ${{ env.MFAA_VERSION }} 
          path: MFA-src
          fetch-depth: 1
      
      # 替换EXE图标文件
      - name: Replace MFAAvalonia icon
        run: |
          cp assets/logo.ico MFA-src/MFAAvalonia/Assets/logo.ico
          echo "已替换 Windows 版 MFAAvalonia 的 logo.ico"

      # MaaAgent 协议 9 要求 UI 与 Python Agent 使用同版原生运行时
      - name: Align MFAAvalonia MaaFramework runtime
        shell: pwsh
        run: |
          $projectPath = "MFA-src/MFAAvalonia/MFAAvalonia.csproj"
          [xml]$project = Get-Content -Raw $projectPath
          $runtime = $project.SelectSingleNode("//PackageReference[@Include='Maa.Framework.Runtimes']")
          if ($null -eq $runtime) {
            throw "MFAAvalonia Maa.Framework.Runtimes reference is missing"
          }
          $runtime.Version = $env:MAA_FRAMEWORK_VERSION.Substring(1)
          $project.Save((Join-Path $PWD $projectPath))
      
      # 设置 .NET 版本
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # 编译修改过的 MFAAvalonia
      - name: Build MFAAvaloni
        shell: pwsh
        run: |
          cd MFA-src
          dotnet publish MFAAvalonia.Desktop/MFAAvalonia.Desktop.csproj -c Release -r win-${{ matrix.arch == 'x86_64' && 'x64' || 'arm64' }} --self-contained true
          cd ..
          New-Item -ItemType Directory -Force -Path MFA | Out-Null
          Copy-Item -Path "MFA-src/bin/AnyCPU/Release/win-${{ matrix.arch == 'x86_64' && 'x64' || 'arm64' }}/publish/*" -Destination "MFA" -Recurse -Force

      # 缓存 resource 目录下的所有资源文件,以便后续 Action 运行时可以直接使用缓存的资源文件, 避免重复下载浪费时间和流量
      - name: Cache Resources
        uses: actions/cache@v6
        id: resource-cache-python-embeddable-zip-and-get-pip
        with:
          path: |
            resource/embeddable_python_zip
            resource/get-pip.py
          key: resource-cache-${{ matrix.platform }}-${{ matrix.arch }}-v0.3.0

      # 下载不同系统的 embeddable python zip 包放在 ./resource/embeddable_python_zip 目录下
      - name: Download embeddable Python
        if: steps.resource-cache-python-embeddable-zip-and-get-pip.outputs.cache-hit != 'true'
        shell: bash
        # https://www.python.org/ftp/python/3.13.7/python-3.13.7-embed-amd64.zip
        # https://www.python.org/ftp/python/3.13.7/python-3.13.7-embed-win32.zip
        # https://www.python.org/ftp/python/3.13.7/python-3.13.7-embed-arm64.zip
        run: |
          EMBEDDABLE_PYTHON_DIR="./resource/embeddable_python_zip"
          mkdir -p "${EMBEDDABLE_PYTHON_DIR}"
          if [[ "${{ matrix.platform }}" == "win" ]]; then
            if [[ "${{ matrix.arch }}" == "x86_64" ]]; then
              echo "Downloading embeddable Python for Windows x86_64..."
              PYTHON_URL="https://www.python.org/ftp/python/3.13.7/python-3.13.7-embed-amd64.zip"
            else
              echo "Downloading embeddable Python for Windows ARM64..."
              PYTHON_URL="https://www.python.org/ftp/python/3.13.7/python-3.13.7-embed-arm64.zip"
            fi
            echo "Downloading embeddable Python from ${PYTHON_URL}..."
            curl -L -o "${EMBEDDABLE_PYTHON_DIR}/python-3.13.7-embed-${{ matrix.arch }}.zip" "${PYTHON_URL}"
          else
            echo "便携版Python目前仅支持Windows系统, 对于${{ matrix.platform }}系统将跳过下载步骤."
          fi
          
      # 下载 get-pip.py 到 ./resource/get-pip.py
      - name: Download get-pip.py
        if: steps.resource-cache-python-embeddable-zip-and-get-pip.outputs.cache-hit != 'true'
        shell: bash
        run: |
          curl -L -o ./resource/get-pip.py https://bootstrap.pypa.io/get-pip.py

      # 根据项目 pyproject.toml 下载离线的 Python Wheels 包到 ./resource/wheels 目录下
      # - name: Download Windows Python Wheels
      #   # if: steps.resource-cache.outputs.cache-hit != 'true'
      #   shell: bash
      #   run: |
      #     python scripts/download_wheels.py  --platform win_amd64 --python-version 3.13 --abi cp313 --dest ./resource/wheels  --extra "colorama>=0.4.6"

      - name: Download wheels artifact
        if: matrix.platform == 'win' && matrix.arch == 'x86_64'
        uses: actions/download-artifact@v8
        with:
          name: wheels-win-x64
          path: resource/wheels/win-x64


      - name: Install
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        # 需要先安装 loguru, 否则 install.py 里面的 logger 会报错
        run: |
          pip install loguru
          python scripts/install.py ${{ needs.meta.outputs.tag }} ${{ matrix.platform }} ${{ matrix.arch }}

          if [[ "${{ matrix.platform }}" != "android" ]]; then
            if [ -d "MFA" ]; then
              echo "Copying MFA files to install directory..."
              mkdir -p install
              if [[ "$RUNNER_OS" == "Windows" ]]; then
                pwsh -Command "Copy-Item -Path MFA/* -Destination install -Recurse -Force"
              else
                rsync -av --ignore-existing MFA/ install/
              fi
            else
              echo "MFA directory not found, skipping copy."
            fi
          else
            echo "Skipping copy MFA for Android."
          fi 

      - uses: actions/upload-artifact@v7
        with:
          name: MaaStarResonance-${{ matrix.platform }}-${{ matrix.arch }}
          path: "install"

  changelog:
    name: Generate changelog
    runs-on: ubuntu-latest
    needs: [meta]
    permissions:
      contents: write
    outputs:
      release_body: ${{ steps.generate-changelog.outputs.content }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Generate changelog with Python script
        id: generate-changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 生成最新版本的 changelog
          python scripts/generate_changelog.py --latest > CHANGES.md
          
          # 将内容输出到 GitHub Actions output
          {
            echo 'content<<EOF'
            cat CHANGES.md
            echo EOF
          } >> "$GITHUB_OUTPUT"
          
          echo "✅ Changelog 已生成"

      - name: Commit CHANGELOG
        if: ${{ needs.meta.outputs.is_release == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/generate_changelog.py --output CHANGELOG.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .vscode/changelog-pr-authors.json
          git add CHANGELOG.md
          git diff --cached --quiet && exit 0
          git commit -m "chore🔧: Update CHANGELOG"
          git push origin HEAD:${{ github.event.repository.default_branch }}

  release:
    if: ${{ needs.meta.outputs.is_release == 'true' }}
    needs: [meta, install, android, changelog]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download desktop packages
        uses: actions/download-artifact@v8
        with:
          pattern: MaaStarResonance-win-*
          path: desktop-artifacts

      - name: Download Android APKs and checksums
        uses: actions/download-artifact@v8
        with:
          pattern: MaaStarResonance-android-*
          path: release-assets
          merge-multiple: true

      - name: Package desktop assets without wrapping APKs
        env:
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          for arch in x86_64 aarch64; do
            name="MaaStarResonance-win-$arch"
            (cd "desktop-artifacts/$name" && zip -r "$GITHUB_WORKSPACE/release-assets/$name-$TAG.zip" .)
          done
          for arch in arm64 x64; do
            name="MaaStarResonance-android-$arch-$TAG.apk"
            (cd release-assets && sha256sum --check "$name.sha256")
          done

      - uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
          fail_on_unmatched_files: true
          tag_name: ${{ needs.meta.outputs.tag }}
          body: ${{ needs.changelog.outputs.release_body }}
          draft: false
          prerelease: ${{ needs.meta.outputs.is_prerelease == 'true' }}

  mirrorchyan:
    if: ${{ needs.meta.outputs.is_release == 'true' }}
    needs: [meta, release]
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/mirrorchyan.yml
    with:
      tag: ${{ needs.meta.outputs.tag }}
    secrets:
      MirrorChyanUploadToken: ${{ secrets.MirrorChyanUploadToken }}

  mirrorchyan-release-note:
    if: ${{ needs.meta.outputs.is_release == 'true' }}
    needs: [meta, mirrorchyan]
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/mirrorchyan_release_note.yml
    with:
      tag: ${{ needs.meta.outputs.tag }}
    secrets:
      MirrorChyanUploadToken: ${{ secrets.MirrorChyanUploadToken }}
