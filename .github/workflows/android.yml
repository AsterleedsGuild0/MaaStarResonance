name: Android development APK

on:
  push:
    branches:
      - feat/android-apk
    paths:
      - ".github/workflows/android.yml"
      - "android/**"
      - "requirements-android.txt"
      - "pyproject.toml"
      - "scripts/json_utils.py"
      - "tests/test_android_packaging.py"
      - "agent/**"
      - "assets/**"
      - "assets/MaaCommonAssets"
      - "static/img/logo_transparent.png"
      - "LICENSE"
      - "README.md"
      - "CONTACT"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: MaaFwApp (${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            arch: arm64
          - abi: x86_64
            arch: x64

    steps:
      - name: Checkout project resources
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Check Android packaging
        run: python -m unittest discover -s tests -p test_android_packaging.py -v

      - name: Prepare Android payload and profile
        id: prepare
        run: |
          python android/prepare.py \
            --abi "${{ matrix.abi }}" \
            --version-code "$((10000 + GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))" \
            --github-output "$GITHUB_OUTPUT"

      - name: Checkout pinned MaaFwApp
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.prepare.outputs.app_repository }}
          ref: ${{ steps.prepare.outputs.app_revision }}
          path: android/MaaFwApp
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install pinned Android build tools
        run: |
          sdkmanager --install \
            "platforms;android-${{ steps.prepare.outputs.compile_sdk }}" \
            "build-tools;${{ steps.prepare.outputs.build_tools }}" \
            "ndk;${{ steps.prepare.outputs.ndk_version }}" \
            "cmake;${{ steps.prepare.outputs.cmake_version }}"

      - name: Cache verified Agent Core and pure Python wheel
        uses: actions/cache@v6
        with:
          path: |
            android/.build/downloads
            android/.build/wheels
          key: android-runtime-${{ matrix.abi }}-${{ hashFiles('android/build-config.json', 'android/build_runtime.py', 'requirements-android.txt') }}

      - name: Assemble Android Python runtime
        run: python android/build_runtime.py --abi "${{ matrix.abi }}"

      - name: Deploy matching MaaFramework native libraries
        working-directory: android/MaaFwApp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/setup_maa_framework.py \
            --abi "${{ matrix.abi }}" \
            --tag "${{ steps.prepare.outputs.maafw_tag }}"

      # 只构建开发工件，但保持永久证书，避免每次 CI 都无法覆盖安装。
      - name: Prepare fixed signing keystore
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing signing secret: $name"
              exit 1
            fi
          done
          umask 077
          keystore="$RUNNER_TEMP/maastarresonance.jks"
          certificate="$RUNNER_TEMP/maastarresonance.der"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          keytool -exportcert \
            -keystore "$keystore" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD \
            -alias "$ANDROID_KEY_ALIAS" \
            -file "$certificate"
          echo "keystore=$keystore" >> "$GITHUB_OUTPUT"
          echo "certificate=$(sha256sum "$certificate" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Build signed development APK and check multitouch
        working-directory: android/MaaFwApp
        env:
          PI_PROFILE: ${{ github.workspace }}/android/.build/profile.json
          BUILD_VERSION_NAME: ${{ steps.prepare.outputs.version_name }}
          BUILD_VERSION_CODE: ${{ steps.prepare.outputs.version_code }}
          BUILD_APPLICATION_ID: ${{ steps.prepare.outputs.application_id }}
          KEYSTORE_PATH: ${{ steps.signing.outputs.keystore }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "build.releaseAbi=${{ matrix.abi }}"
            echo "build.debugAbi=${{ matrix.abi }}"
            echo "build.ndkVersion=${{ steps.prepare.outputs.ndk_version }}"
          } > local.properties
          chmod +x gradlew
          ./gradlew --no-daemon --init-script ../maafwapp.init.gradle \
            :app:testDebugUnitTest \
            --tests com.aliothmoon.maafw.bridge.TouchPointerSequenceTest \
            verifyReleaseResources :app:assembleRelease

      - name: Verify and collect signed APK
        env:
          VERSION: ${{ steps.prepare.outputs.version_name }}
          VERSION_CODE: ${{ steps.prepare.outputs.version_code }}
          CERTIFICATE: ${{ steps.signing.outputs.certificate }}
        run: |
          apks=(android/MaaFwApp/app/build/outputs/apk/release/*.apk)
          if [[ "${#apks[@]}" != 1 || ! -f "${apks[0]}" ]]; then
            echo "::error::Expected exactly one signed APK"
            exit 1
          fi
          python android/verify_apk.py "${apks[0]}" \
            --abi "${{ matrix.abi }}" \
            --version "$VERSION" --version-code "$VERSION_CODE" \
            --certificate "$CERTIFICATE" \
            --build-tools "$ANDROID_HOME/build-tools/${{ steps.prepare.outputs.build_tools }}"
          mkdir -p android-artifacts
          name="MaaStarResonance-$VERSION-android-${{ matrix.arch }}.apk"
          cp "${apks[0]}" "android-artifacts/$name"
          (cd android-artifacts && sha256sum "$name" > "$name.sha256")

      - name: Upload development APK
        uses: actions/upload-artifact@v7
        with:
          name: MaaStarResonance-android-${{ matrix.arch }}
          path: android-artifacts
          if-no-files-found: error
          retention-days: 7
